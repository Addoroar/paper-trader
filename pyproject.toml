[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "papertrader"
version = "0.1.0"
description = "Autonomous paper-trading bot: simulated trades with fake money against real market data."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "yfinance>=0.2.50",
    "ccxt>=4.3",
    "pandas>=2.2",
    "numpy>=2.1",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "streamlit>=1.40",
    "plotly>=5.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
papertrader = "papertrader.cli:main"

[tool.setuptools.packages.find]
include = ["papertrader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
